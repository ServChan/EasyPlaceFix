name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft-version:
          - "26.1.2"
          - "26.2"

    name: Build for Minecraft ${{ matrix.minecraft-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: .\gradlew.bat clean build -Pminecraft_version=${{ matrix.minecraft-version }} --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: EasyPlaceFix-mc${{ matrix.minecraft-version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
